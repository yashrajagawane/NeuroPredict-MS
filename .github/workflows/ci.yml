name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-dev.lock

      - name: Install locked API and developer dependencies
        run: python -m pip install -r requirements-api.lock -r requirements-dev.lock

      - name: Run existing unittest suite
        run: python -m unittest discover -s data/tests -v

      - name: Run pytest suite
        run: python -m pytest

      - name: Check Python lint
        run: python -m ruff check backend data/scripts data/tests

      - name: Check Python formatting
        run: python -m ruff format --check backend data/scripts data/tests

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit
