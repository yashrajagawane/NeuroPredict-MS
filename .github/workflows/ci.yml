name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked developer tools
        run: python -m pip install -r requirements-dev.lock

      - name: Run existing unittest suite
        run: python -m unittest discover -s data/tests -v

      - name: Run pytest suite
        run: python -m pytest

      - name: Check Python lint
        run: python -m ruff check data/scripts data/tests

      - name: Check Python formatting
        run: python -m ruff format --check data/scripts data/tests
